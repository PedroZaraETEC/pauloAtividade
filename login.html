<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>
<body>
    <div>
        <input type="text" name="cpf" id="cpf">
        <input type="submit" value="Entrar" onclick="verificar()">

        <script>
            function verificar() {
                let cpf = document.getElementById("cpf").value;
                let requisicao = new XMLHttpRequest();
                requisicao.open("POST", `dataTravel.php&cpf=${cpf}&action=consultarUser`);
                let data = requisicao.send();
                console.log(data);
            }
        </script>
    </div>
</body>
</html>
